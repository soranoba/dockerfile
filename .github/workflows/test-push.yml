name: Test ghcr.io push

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push minimal image
        run: |
          echo 'FROM alpine:3.21' | docker build -t ghcr.io/soranoba/test:ci -
          docker push ghcr.io/soranoba/test:ci

      - name: Cleanup
        if: always()
        run: |
          docker rmi ghcr.io/soranoba/test:ci || true
